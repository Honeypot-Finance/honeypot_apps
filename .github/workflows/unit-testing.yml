name: 🧪 Run Tests

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 🛠 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🧪 Run all unit tests
        run: pnpm test:coverage

      - name: 📊 Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 🧾 Generate test summary
        run: |
          echo "## ✅ Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Wasabee: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- Pot2Pump: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- All-in-One Vault: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- Dreampad: Coverage report generated" >> $GITHUB_STEP_SUMMARY
