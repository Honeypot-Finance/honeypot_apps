name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm nx run-many --target=lint --all --parallel

      - name: Run type checking
        run: pnpm nx run-many --target=build --all --parallel

      - name: Run unit tests - Wasabee
        run: pnpm nx test wasabee --coverage --watchAll=false

      - name: Run unit tests - Pot2Pump
        run: pnpm nx test pot2pump --coverage --watchAll=false

      - name: Run unit tests - All-in-One Vault
        run: pnpm nx test all-in-one-vault --coverage --watchAll=false

      - name: Run unit tests - Leaderboard
        run: pnpm nx test leaderboard --coverage --watchAll=false

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Wasabee: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- Pot2Pump: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- All-in-One Vault: Coverage report generated" >> $GITHUB_STEP_SUMMARY
          echo "- Leaderboard: Coverage report generated" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.10.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: |
          echo "Running integration tests for cross-app functionality"
          # Add integration test commands here when available
          echo "Integration tests completed"

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          npm audit --audit-level=high
          echo "Security scan completed"

      - name: Check for vulnerabilities
        run: |
          echo "Checking for known vulnerabilities in dependencies"
          # Add vulnerability scanning tools here if needed
